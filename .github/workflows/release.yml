name: Build and Release NetTool

on:
  push:
    tags:
      - "V*R*C*SPC*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example V100R008C00SPC700"
        required: true
        default: "V100R008C00SPC700"

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^V[0-9]+R[0-9]+C[0-9]+SPC[0-9]+$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-macos:
    name: Build macOS DMG
    needs: prepare
    runs-on: macos-latest
    env:
      NETTOOL_VERSION: ${{ needs.prepare.outputs.version }}
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python sources
        run: |
          python -m compileall -q network_toolbox.py core modules

      - name: Import Apple signing certificate
        if: env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/nettool-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "${IDENTITY}" ]]; then
            echo "Developer ID Application certificate not found." >&2
            exit 1
          fi

          echo "CODESIGN_IDENTITY=${IDENTITY}" >> "${GITHUB_ENV}"

      - name: Build app
        run: |
          python -m PyInstaller --noconfirm --clean NetTool.spec
          xattr -rd com.apple.provenance dist/NetTool.app 2>/dev/null || true
          xattr -cr dist/NetTool.app || true
          if [[ "${HAS_MACOS_CERTIFICATE}" == "true" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "${CODESIGN_IDENTITY}" dist/NetTool.app
            codesign --verify --deep --strict --verbose=2 dist/NetTool.app
          else
            echo "Apple Developer ID certificate is not configured; using ad-hoc signing."
            codesign --force --deep --sign - dist/NetTool.app
            codesign --verify --deep --verbose=2 dist/NetTool.app
          fi

      - name: Create DMG
        run: |
          mkdir -p release/macOS
          rm -rf /tmp/NetTool-dmg-staging
          mkdir -p /tmp/NetTool-dmg-staging
          cp -R dist/NetTool.app /tmp/NetTool-dmg-staging/
          ln -s /Applications /tmp/NetTool-dmg-staging/Applications
          hdiutil create \
            -volname "NetTool ${NETTOOL_VERSION}" \
            -srcfolder /tmp/NetTool-dmg-staging \
            -ov \
            -format UDZO \
            "release/macOS/NetTool-${NETTOOL_VERSION}.dmg"
          hdiutil verify "release/macOS/NetTool-${NETTOOL_VERSION}.dmg"

      - name: Notarize DMG
        if: env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "release/macOS/NetTool-${NETTOOL_VERSION}.dmg" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "release/macOS/NetTool-${NETTOOL_VERSION}.dmg"
          xcrun stapler validate "release/macOS/NetTool-${NETTOOL_VERSION}.dmg"

      - name: Notarization notice
        if: env.HAS_MACOS_NOTARIZATION != 'true'
        run: |
          echo "Apple notarization secrets are not configured; downloaded DMG may trigger Gatekeeper warning."

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/macOS/NetTool-${{ needs.prepare.outputs.version }}.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    needs: prepare
    runs-on: windows-latest
    env:
      NETTOOL_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate Python sources
        run: |
          python -m compileall -q network_toolbox.py core modules

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --name="NetTool-${env:NETTOOL_VERSION}" `
            --onefile `
            --windowed `
            --uac-admin `
            --icon="release/Windows/netool.ico" `
            --version-file="release/Windows/version_info.txt" `
            --add-data="data;data" `
            --add-data="templates;templates" `
            --add-data="image_icon.png;." `
            --collect-all modules `
            --hidden-import="queue" `
            --hidden-import="pyftpdlib" `
            --hidden-import="paramiko" `
            --hidden-import="ping3" `
            --hidden-import="PySide6" `
            --noconfirm `
            --clean `
            network_toolbox.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NetTool-${{ needs.prepare.outputs.version }}.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NetTool ${{ needs.prepare.outputs.version }}
          make_latest: true
          body: |
            ## 更新说明

            - 自动构建并发布 macOS DMG。
            - 自动构建并发布 Windows EXE。
            - 安装包由 GitHub Actions 生成，源码仓库不再跟踪二进制发布包。
          files: |
            artifacts/macos-dmg/NetTool-${{ needs.prepare.outputs.version }}.dmg
            artifacts/windows-exe/NetTool-${{ needs.prepare.outputs.version }}.exe
