<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#00bcd4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded rect background -->
  <rect x="2" y="2" width="1020" height="1020" rx="225" ry="225" fill="url(#bgGrad)"/>
  
  <!-- Globe circle -->
  <circle cx="512" cy="512" r="307" fill="none" stroke="white" stroke-width="6" filter="url(#glow)" opacity="0.95"/>
  
  <!-- Equator -->
  <line x1="205" y1="512" x2="819" y2="512" stroke="white" stroke-width="3" opacity="0.9"/>
  
  <!-- Prime meridian -->
  <line x1="512" y1="205" x2="512" y2="819" stroke="white" stroke-width="3" opacity="0.9"/>
  
  <!-- Latitude lines -->
  <ellipse cx="512" cy="359" rx="265" ry="20" fill="none" stroke="white" stroke-width="3" opacity="0.75"/>
  <ellipse cx="512" cy="665" rx="265" ry="20" fill="none" stroke="white" stroke-width="3" opacity="0.75"/>
  
  <!-- Longitude ellipses -->
  <ellipse cx="512" cy="512" rx="153" ry="307" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <ellipse cx="512" cy="512" rx="265" ry="180" fill="none" stroke="white" stroke-width="2" opacity="0.55"/>
  
  <!-- Connection nodes (glowing dots) -->
  <g filter="url(#glow)">
    <circle cx="512" cy="297" r="10" fill="#c8e6ff"/>
    <circle cx="512" cy="297" r="6" fill="white"/>
    
    <circle cx="512" cy="720" r="10" fill="#c8e6ff"/>
    <circle cx="512" cy="720" r="6" fill="white"/>
    
    <circle cx="350" cy="404" r="9" fill="#c8e6ff"/>
    <circle cx="350" cy="404" r="5" fill="white"/>
    
    <circle cx="685" cy="436" r="9" fill="#c8e6ff"/>
    <circle cx="685" cy="436" r="5" fill="white"/>
    
    <circle cx="385" cy="573" r="9" fill="#c8e6ff"/>
    <circle cx="385" cy="573" r="5" fill="white"/>
    
    <circle cx="650" cy="600" r="9" fill="#c8e6ff"/>
    <circle cx="650" cy="600" r="5" fill="white"/>
    
    <circle cx="728" cy="512" r="10" fill="#c8e6ff"/>
    <circle cx="728" cy="512" r="6" fill="white"/>
    
    <circle cx="295" cy="543" r="9" fill="#c8e6ff"/>
    <circle cx="295" cy="543" r="5" fill="white"/>
  </g>
</svg>
